<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kas 10¹</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <h2>Dashboard Kas 10¹</h2>
        <button id="btn-logout" class="danger">Logout</button>
    </nav>
    <div class="container">
        <div class="card" style="text-align: center;">
            <h3>Saldo Kas Saat Ini</h3>
            <h1 style="font-size: 3em; color: var(--success);" id="total-saldo">Rp 0</h1>
        </div>

        <div class="card">
            <h3>Berita Terkini</h3>
            <div class="news-carousel" id="news-container">
                <!-- Data berita akan di-load lewat API -->
            </div>
        </div>

        <div class="card">
            <h3>Status Pembayaran Anggota (Minggu Ini)</h3>
            <div class="member-list" id="member-list">
                <!-- Daftar member real-time -->
            </div>
        </div>
        
        <div class="card">
            <h3>Riwayat Kas</h3>
            <div id="log-list" style="font-size: 14px;"></div>
        </div>
    </div>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
