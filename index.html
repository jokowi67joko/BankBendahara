<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bank Bendahara 10¹</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background Animasi Lingkaran Cahaya Lembut -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <!-- Card Login Glassmorphism -->
  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand-header">
        <div class="logo-badge">🏛️</div>
        <h2>Bank Bendahara 10¹</h2>
        <p>Silakan masuk menggunakan akun kas/admin</p>
      </div>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <div class="input-icon-wrap">
            <input 
              type="email" 
              id="email" 
              placeholder="nama@contoh.com" 
              required
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password / Admin Key</label>
          <div class="input-icon-wrap">
            <input 
              type="password" 
              id="password" 
              placeholder="Masukkan password / key..." 
              required
              autocomplete="current-password"
            >
          </div>
        </div>

        <p id="error-msg" class="error-msg"></p>

        <button type="submit" id="btn-submit" class="btn-login">
          <span class="btn-text">Masuk Sekarang</span>
          <span class="spinner" style="display: none;"></span>
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
